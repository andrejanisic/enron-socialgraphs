[project]
name = "enron-socialgraphs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enron"]
